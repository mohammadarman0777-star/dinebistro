<!DOCTYPE html>
<html>
<head>
<title>Dine Bistro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:black;
color:white;
text-align:center;
}
header{
background:#111;
padding:20px;
font-size:28px;
color:gold;
font-weight:bold;
}
.menu{
padding:20px;
}
.item{
background:#1a1a1a;
margin:15px;
padding:15px;
border-radius:10px;
}
button{
background:gold;
color:black;
padding:10px 20px;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}
button:hover{
background:orange;
}
form{
background:#1a1a1a;
margin:20px;
padding:20px;
border-radius:10px;
}
input, textarea{
width:90%;
padding:10px;
margin:8px;
border-radius:5px;
border:none;
}
footer{
margin-top:20px;
padding:10px;
background:#111;
color:gray;
}
</style>
</head>
<body>

<header>DINE BISTRO</header>

<div class="menu">
<h2>Our Menu</h2>

<div class="item">
<h3>Chicken Biryani (Full) - ₹90</h3>
<button onclick="order('Chicken Biryani Full - ₹90')">Order Now</button>
</div>

<div class="item">
<h3>Chicken Biryani (Half) - ₹60</h3>
<button onclick="order('Chicken Biryani Half - ₹60')">Order Now</button>
</div>

<div class="item">
<h3>Soya Chaap - ₹80</h3>
<button onclick="order('Soya Chaap - ₹80')">Order Now</button>
</div>

<div class="item">
<h3>Paneer Tikka (6 pcs) - ₹90</h3>
<button onclick="order('Paneer Tikka - ₹90')">Order Now</button>
</div>

</div>

<form id="orderForm">
<h2>Customer Details</h2>
<input type="text" id="name" placeholder="Your Name" required><br>
<textarea id="address" placeholder="Your Full Address with Location" required></textarea><br>
</form>

<script>
function order(item){
var name=document.getElementById("name").value;
var address=document.getElementById("address").value;

if(name=="" || address==""){
alert("Please enter your name and address first.");
return;
}

var phone="919839513573"; //
var message="New Order from Dine Bistro%0A%0AItem: "+item+"%0AName: "+name+"%0AAddress: "+address;

window.open("https://wa.me/"+phone+"?text="+message,"_blank");
}
</script>

<footer>
📍 Matera Railway Station Bhaukhara (Bahraich)<br>
Fresh • Tasty • Affordable
</footer>

</body>
</html>
